[project]
name = "talent-estimation-agent"
version = "0.1.0"
description = "Agentic system that validates talent requests from a project WBS using Use Case Points and bottom-up estimation."
readme = "README.md"
license = "MIT"
authors = [{ name = "Adryan Rizky Alviano" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "langgraph>=0.6",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.1",
    "reportlab>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "pre-commit>=4.0",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talent_estimation"]

[tool.uv.workspace]
members = ["evaluation"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "api", "tests"]
extend-exclude = ["evaluation", "node_modules", ".next"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D", "N", "RUF"]
ignore = ["E501", "D105", "D107", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
